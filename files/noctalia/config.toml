[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-fruit-salad"
pure_black_dark = true

[wallpaper]
directory = "~/dotfiles/files/wallpapers"

[wallpaper.default]
path = "~/dotfiles/files/wallpapers/a.jpg"

[wallpaper.last]
path = "~/dotfiles/files/wallpapers/a.jpg"

[wallpaper.monitors.DP-2]
path = "~/dotfiles/files/wallpapers/a.jpg"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["sway", "alacritty", "gtk3", "gtk4", "qt"]

[bar.default]
center = ["workspaces"]
concave_edge_corners = false
end = [
  "wallpaper",
  "media",
  "tray",
  "notifications",
  "clipboard",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
margin_ends = 0
position = "bottom"
radius = 0
start = ["clock", "launcher"]

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = false
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = false
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 196.0
box_width = 810.0
cx = 1024.0
cy = 970.0
output = "DP-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[notification]
background_opacity = 1.0
offset_x = 32
offset_y = 32

[osd]
background_opacity = 1.0

[shell]
corner_radius_scale = 0.0
font_family = "Cascadia Code"

[widget.bluetooth]
enabled = false

[widget.clipboard]
enabled = false

[widget.control-center]
enabled = false

[widget.launcher]
enabled = false

[widget.media]
enabled = false

[widget.notifications]
enabled = false

[widget.tray]
enabled = false
